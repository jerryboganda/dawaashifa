# Prometheus Configuration (Doc 17 §5, §7)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "shifa-api"
    static_configs:
      - targets: ["api:8080"]
    metrics_path: "/api/v1/metrics"

  - job_name: "shifa-otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
