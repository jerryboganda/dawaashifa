# ------------------------------------------------------------
# dawaa.polytronx.com
# ------------------------------------------------------------

server {
  set $forward_scheme http;
  set $server         "shifa-caddy";
  set $port           80;

  listen 80;
  listen [::]:80;

  listen 443 ssl;
  listen [::]:443 ssl;

  server_name dawaa.polytronx.com;
  http2 on;

  # SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-5/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-5/privkey.pem;

  # Block Exploits
  include conf.d/include/block-exploits.conf;

  access_log /data/logs/proxy-host-52_access.log proxy;
  error_log /data/logs/proxy-host-52_error.log warn;

  client_max_body_size 100M;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    # Proxy to Shifa Caddy Multiplexer
    proxy_pass http://shifa-caddy:80;
  }
}
