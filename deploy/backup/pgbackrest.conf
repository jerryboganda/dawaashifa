# pgBackRest Production Configuration (Doc 17 §9)
# Full daily backup, continuous WAL archiving, 30-day PITR retention

[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-retention-full=30
repo1-retention-diff=7
process-max=4
log-level-console=info
log-level-file=detail
start-fast=y
compress-type=lz4
compress-level=3

[shifa]
pg1-path=/var/lib/postgresql/data
pg1-user=shifa
pg1-port=5432
