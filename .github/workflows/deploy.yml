name: Deploy to Production VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'deploy/**'
      - 'sidecars/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pnpm-lock.yaml'

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.image.name }} to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            context: .
            dockerfile: deploy/Dockerfile.api
            args: ""
          - name: worker
            context: .
            dockerfile: deploy/Dockerfile.worker
            args: ""
          - name: web
            context: .
            dockerfile: deploy/Dockerfile.frontend
            args: APP_NAME=web
          - name: console
            context: .
            dockerfile: deploy/Dockerfile.frontend
            args: APP_NAME=console
          - name: rider
            context: .
            dockerfile: deploy/Dockerfile.frontend
            args: APP_NAME=rider
          - name: wa-unofficial
            context: ./sidecars/wa-unofficial
            dockerfile: sidecars/wa-unofficial/Dockerfile
            args: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.args }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.image.name }}:latest
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  deploy:
    name: Deploy to dawaa.polytronx.com
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.VPS_HOST != '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "==> Deploying pre-built Dawaa Platform containers to dawaa.polytronx.com..."
            
            # Navigate or clone into workspace
            if [ ! -d "/opt/dawaa" ]; then
              echo "Cloning repository into /opt/dawaa..."
              git clone https://github.com/jerryboganda/dawaashifa.git /opt/dawaa
            fi
            
            cd /opt/dawaa
            git fetch origin main
            git reset --hard origin/main
            
            # Setup environment if not present
            if [ ! -f "deploy/.env" ]; then
              cp .env.example deploy/.env
            fi
            
            # Pull pre-built images from GHCR (Zero compilation on VPS!)
            cd deploy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
            
            echo "==> Zero-Build Deployment Complete! Health Check: https://dawaa.polytronx.com/health"
