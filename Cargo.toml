[workspace]
members = [
    "crates/core",
    "crates/db",
    "crates/identity",
    "crates/catalog",
    "crates/inventory",
    "crates/channel",
    "crates/conversation",
    "crates/ai",
    "crates/prescription",
    "crates/orders",
    "crates/payments",
    "crates/fulfilment",
    "crates/b2b",
    "crates/tax",
    "crates/admin",
    "crates/api",
    "crates/worker",
    "crates/migration-tool",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Shifa Platform Team"]
license = "Proprietary"

[workspace.dependencies]
# Internal workspace crates
shifa-core = { path = "crates/core" }
shifa-db = { path = "crates/db" }
shifa-identity = { path = "crates/identity" }
shifa-catalog = { path = "crates/catalog" }
shifa-inventory = { path = "crates/inventory" }
shifa-channel = { path = "crates/channel" }
shifa-conversation = { path = "crates/conversation" }
shifa-ai = { path = "crates/ai" }
shifa-prescription = { path = "crates/prescription" }
shifa-orders = { path = "crates/orders" }
shifa-payments = { path = "crates/payments" }
shifa-fulfilment = { path = "crates/fulfilment" }
shifa-b2b = { path = "crates/b2b" }
shifa-tax = { path = "crates/tax" }
shifa-admin = { path = "crates/admin" }
shifa-api = { path = "crates/api" }
shifa-worker = { path = "crates/worker" }
shifa-migration-tool = { path = "crates/migration-tool" }

# External shared dependencies
rust_decimal = { version = "1.36", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "rust_decimal", "chrono", "migrate", "macros"] }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
jsonwebtoken = "9.3"
rand = "0.8"
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
utoipa = { version = "4.2", features = ["axum_extras", "uuid", "chrono", "decimal"] }
utoipa-swagger-ui = { version = "7.1", features = ["axum"] }
